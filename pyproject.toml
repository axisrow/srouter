[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srouter"
version = "0.1.0"
description = "Локальный дашборд и установщик srouter: мониторинг и управление цепочкой privoxy→xray→Reality."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "srouter" }]
dependencies = ["flask>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Operating System :: MacOS",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.8", "pytest-randomly>=4.1"]

[project.scripts]
srouter = "srouter:main"

[tool.setuptools]
py-modules = [
    "dashboard",
    "dashboard_app",
    "dashboard_routes",
    "srouter",
    "srouter_cli",
    "srouter_privileged",
    "codex_wrappers",
    "srouter_launchd",
    "install_lib",
    "install_plist",
    "install_config",
    "install_cleanup",
    "marker_block",
    "local_state",
    "local_state_traffic_guard",
    "local_state_isolate",
    "local_state_nodes",
    "local_state_xray",
    "local_state_routing",
    "dashboard_common",
    "dashboard_connectivity",
    "dashboard_geo",
    "dashboard_network",
    "dashboard_nodes",
    "dashboard_traffic",
    "dashboard_hotroutes",
    "hot_routes",
    "metrics_store",
    "proxy_errors",
    "node_selector",
    "sys_probe",
    "probe_manager",
    "state_manager",
    "traffic_shape",
    "gen_xray_config",
    "isolate_firewall",
    "dashboard_isolate",
    "git_proxy",
    "claude_proxy",
    "vscode_proxy",
    "proxy_config_contract",
    "health",
    "health_probes",
    "health_claude",
    "health_codex",
    "health_codenv",
    "health_devworkflow",
    "health_endpoint",
    "health_constants",
    "privoxy_system",
    "privoxy_control",
    "privoxy_helper_fs",
    "privoxy_helper_launchd",
    "privoxy_helper_config",
    "privoxy_audit",
    "privileged_ops",
    "lock_hierarchy",
    "direct_first",
    "proxy_effective",
    "system_proxy",
    "system_proxy_control",
    "proxy_registry",
]

[tool.setuptools.package-data]
"*" = ["launchagents/*.plist", "static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "acceptance: end-to-end приёмочные тесты реального CLI srouter в Docker-полигоне (skip без SROUTER_ACCEPTANCE=1)",
    "locks: threading/concurrency-тесты иерархии блокировок и watchdog (issue #159)",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
# Issue #161: гвардим только широкий except — не берём E/F/W целиком, чтобы не тащить
# в CI несвязанные codestyle-ошибки (line-too-long, unused-var и т.п.) из старого кода.
# E722: bare except (без типа исключения)
# BLE001: except Exception / except BaseException без явного обоснования
select = ["E722", "BLE"]
ignore = []

# Используй конкретные типы исключений: OSError, ValueError, TypeError, KeyError,
# subprocess.CalledProcessError, json.JSONDecodeError, requests.RequestException и т.п.
# Точечные ignore per-file для уже существующих осознанных широких catch — снимай ignore
# по мере того как файл дочищается в отдельном PR (issue #161).
[tool.ruff.lint.per-file-ignores]
# BaseException ловится намеренно: dashboard_common raise SystemExit при отсутствии
# srouter_config.py, а SystemExit не перехватывается except Exception — см. комментарий в файле.
"codex_wrappers.py" = ["BLE001"]
# BaseException ловится намеренно (тот же паттерн, что codex_wrappers): dashboard_common raise
# SystemExit при отсутствии srouter_config.py — см. комментарий в файле (#340).
"health_codenv.py" = ["BLE001"]
# except Exception намеренно широкий: гвард используется как best-effort детектор
# osascript-вызовов в тестовой обвязке — см. комментарий в файле.
"tests/conftest.py" = ["BLE001"]
# Тестовые try/except для сбора ошибок из потоков (errors.append(e)) — см. комментарии в файле.
"tests/test_dashboard_hotroutes.py" = ["BLE001"]
