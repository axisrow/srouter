[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srouter"
version = "0.1.0"
description = "Локальный дашборд и установщик srouter: мониторинг и управление цепочкой privoxy→xray→Reality."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "srouter" }]
dependencies = ["flask>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Operating System :: MacOS",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.8", "pytest-randomly>=4.1"]

[project.scripts]
srouter = "srouter:main"

[tool.setuptools]
py-modules = [
    "dashboard",
    "dashboard_app",
    "dashboard_routes",
    "srouter",
    "srouter_cli",
    "srouter_privileged",
    "codex_wrappers",
    "srouter_launchd",
    "install_lib",
    "install_plist",
    "install_config",
    "install_cleanup",
    "marker_block",
    "local_state",
    "dashboard_common",
    "dashboard_connectivity",
    "dashboard_geo",
    "dashboard_network",
    "dashboard_nodes",
    "dashboard_traffic",
    "dashboard_hotroutes",
    "hot_routes",
    "node_selector",
    "sys_probe",
    "probe_manager",
    "state_manager",
    "traffic_shape",
    "gen_xray_config",
    "isolate_firewall",
    "dashboard_isolate",
    "git_proxy",
    "claude_proxy",
    "vscode_proxy",
    "health",
    "privoxy_system",
    "privoxy_audit",
    "privileged_ops",
    "lock_hierarchy",
    "direct_first",
]

[tool.setuptools.package-data]
"*" = ["launchagents/*.plist", "static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "acceptance: end-to-end приёмочные тесты реального CLI srouter в Docker-полигоне (skip без SROUTER_ACCEPTANCE=1)",
    "locks: threading/concurrency-тесты иерархии блокировок и watchdog (issue #159)",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "BLE"]
ignore = []

# BLE001: не разрешаем bare except и широкие except Exception без явного комментария
# E722: bare except (без типа исключения)
# Используй конкретные типы исключений: OSError, ValueError, TypeError, KeyError,
# subprocess.CalledProcessError, json.JSONDecodeError, requests.RequestException и т.п.
# Для осознанных широких catch добавь комментарий: # noqa: BLE001 — <причина>
per-file-ignores = {}
