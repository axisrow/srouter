# srouter-managed-config-v1
# Управляется install.sh. Чужие правки будут считаться конфликтом.
# Зарубежные upstream — собственные резолверы на VPS (порт 5353: GFW-инъекция
# DNS живёт на порту 53; 1.1.1.1/8.8.8.8 напрямую из Китая недоступны).
# Китайские upstream оставлены — операторские CDN-ответы для китайских доменов.
listen-address=127.0.0.1
bind-interfaces
all-servers
cache-size=1000
server=223.5.5.5
server=119.29.29.29
server=85.136.181.198#5353
server=78.47.183.125#5353
