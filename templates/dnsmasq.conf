# srouter-managed-config-v1
# Управляется install.sh. Чужие правки будут считаться конфликтом.
# Split DNS: китайские домены — через список (dnsmasq-china-list, кладётся в
# dnsmasq.d/accelerated-domains.china.conf → 223.5.5.5); всё прочее — собственный
# резолвер на Hetzner (порт 5353: GFW-инъекция DNS живёт на 53, на 5353 путь чист).
# Intel-brew: заменить путь conf-dir на /usr/local/etc/dnsmasq.d.
listen-address=127.0.0.1
bind-interfaces
no-resolv
conf-dir=/opt/homebrew/etc/dnsmasq.d,.conf
server=78.47.183.125#5353
# ↑ пара к templates/vps-dnsmasq.conf: там резолвер по умолчанию слушает ТОЛЬКО
# loopback (fail-closed). Чтобы клиент получал ответы, на VPS нужно раскомментировать
# listen-address=0.0.0.0 — строго после nft rate-limit (см. шапку vps-шаблона).
cache-size=1000
min-cache-ttl=600
domain-needed
bogus-priv
