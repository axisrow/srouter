# Референс конфига VPS-резолвера (серверная часть вне репозитория).
# Положить как /etc/dnsmasq.d/vps-dns.conf на VPS (dnsmasq из пакетов).
#
# Почему 5353: GFW-инъекция DNS работает на порту 53; запросы клиента до VPS
# на нестандартном порту приходят чистыми (проверено замером из Китая).
# Почему server=1.1.1.1/8.8.8.8: с самого VPS (Европа) они доступны.
#
# Анти-amplification (обязательно, root): nft добавить правило
#   nft add rule inet filter input udp dport 5353 limit rate 20/second accept
# либо ограничить source-IP домашним/сотовым диапазоном в фаерволе панели.
port=5353
listen-address=0.0.0.0
no-resolv
server=1.1.1.1
server=8.8.8.8
cache-size=1000
