name: Docker acceptance polygon

# issue #116: приёмочный полигон (issue #112/#114) прогоняется в CI на каждый PR и push в main.
# GitHub Actions runners тянут Docker Hub напрямую (нет GFW) — BASE_IMAGE=python:3.12-slim через
# build-arg, не зеркало docker.m.daocloud.io (issue #113, локальный дефолт в acceptance.Dockerfile).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build acceptance image
        run: |
          docker build \
            --build-arg BASE_IMAGE=python:3.12-slim \
            -f docker/acceptance.Dockerfile \
            -t srouter-acceptance \
            .

      - name: Run acceptance tests (in-container)
        run: |
          docker run --rm \
            -e SROUTER_ACCEPTANCE=1 \
            -e PYTHONUNBUFFERED=1 \
            srouter-acceptance \
            pytest tests/acceptance/ -v -n 0

      # Docker-native .dockerignore canary (issue #116) — host-side тест: собирает
      # docker/canary.Dockerfile ПРЯМО НА РАННЕРЕ (не внутри acceptance-контейнера, где нет docker
      # CLI/daemon). ubuntu-latest раннеры поставляются с preinstalled Docker + Python. Без этого
      # шага canary всегда skip'ался бы в CI (docker недоступен внутри контейнера) — единственным
      # активным guard'ом оставался бы ручной regex-parse .dockerignore, чего PR #220 явно хотел избежать.
      - name: Set up Python for host-side canary test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Docker-native .dockerignore canary (host-side)
        run: |
          pip install pytest pytest-xdist
          pytest tests/acceptance/test_dockerignore_secrets.py::test_secret_paths_absent_from_docker_build_context -v -n 0
